[build-system]
requires = ["setuptools==79.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guiagentlab"
version = "0.1.0"
description = "Reliable mobile-environment rollout and reinforcement learning for GUI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "jinja2==3.1.6",
  "loguru==0.7.3",
  "numpy==2.2.6",
  "openai==2.45.0",
  "pandas==3.0.3",
  "pillow==12.3.0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
]

[project.optional-dependencies]
train = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "dill==0.4.1",
  "hydra-core==1.3.4",
  "peft==0.19.1",
  "pyarrow==25.0.0",
  "qwen-vl-utils[decord]==0.0.14",
  "ray[default]==2.50.0",
  "tensordict==0.10.0",
  "torch==2.8.0",
  "torchdata==0.11.0",
  "transformers==4.57.3",
  "vllm==0.11.0",
  "wandb==0.28.0",
]

[project.scripts]
gal = "guiagentlab.cli:main"

[tool.setuptools.packages.find]
include = ["guiagentlab*"]
